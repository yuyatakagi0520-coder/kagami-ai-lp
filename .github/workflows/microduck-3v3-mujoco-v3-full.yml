name: Microduck six-body MuJoCo 3v3 v3 full

on:
  push:
    branches:
      - tmp-microduck-3v3-mujoco-v3-full-20260901-01

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MUJOCO_GL: egl
  PYOPENGL_PLATFORM: egl

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct and patch runner
        shell: bash
        run: |
          set -euo pipefail
          BASE=experiments/microduck_3v3_mujoco/build_and_run.py.gz.b64
          cat "${BASE}.part00" "${BASE}.part01" \
              "${BASE}.rem00" "${BASE}.rem01" "${BASE}.rem02" "${BASE}.rem03" \
              "${BASE}.rem04" "${BASE}.rem05" "${BASE}.rem06" "${BASE}.rem07" \
              > /tmp/runner.b64
          echo "8f1f9baf285405b14c6fd3729799412b3a9e6b228f4b2898f242807927a354e4  /tmp/runner.b64" | sha256sum -c -
          base64 -d /tmp/runner.b64 | gzip -d > experiments/microduck_3v3_mujoco/build_and_run.py
          python experiments/microduck_3v3_mujoco/patch_v2.py experiments/microduck_3v3_mujoco/build_and_run.py
          python experiments/microduck_3v3_mujoco/patch_v3.py experiments/microduck_3v3_mujoco/build_and_run.py
          python -m py_compile \
            experiments/microduck_3v3_mujoco/build_and_run.py \
            experiments/microduck_3v3_mujoco/patch_v2.py \
            experiments/microduck_3v3_mujoco/patch_v3.py

      - name: Clone official Microduck simulator
        run: |
          git clone --depth 1 https://huggingface.co/spaces/pollen-robotics/microduck-simulator upstream
          git -C upstream rev-parse HEAD | tee upstream-commit.txt

      - name: Install native simulation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libopengl0 libosmesa6
          python -m pip install --upgrade pip
          python -m pip install \
            "mujoco>=3.3,<4" \
            "onnxruntime>=1.20,<2" \
            "numpy>=1.26,<3" \
            "lxml>=5,<7" \
            "imageio>=2.34,<3" \
            "imageio-ffmpeg>=0.5,<1" \
            "pillow>=10,<13"

      - name: Run rendered six-body 3v3 match
        run: |
          mkdir -p artifacts
          set -o pipefail
          python experiments/microduck_3v3_mujoco/build_and_run.py \
            --source-app upstream/app \
            --output artifacts \
            --duration 36 \
            2>&1 | tee artifacts/run.log

      - name: Validate run and generated evidence
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts')
          r = json.loads((root / 'run_report.json').read_text())
          model = r['model']
          goal_return = r['goal_return_validation']
          match = r['match']
          verdict = match['verdict_inputs']

          assert model['duck_count'] == 6, model
          assert model['nu'] == 84, model
          assert model['action_dimensions_total'] == 84, model
          assert model['observation_dimensions_total'] == 366, model
          assert r['kick_calibration']['successful_trial_count'] >= 1
          assert goal_return['returns_started'] >= 1, goal_return
          assert goal_return['returns_completed'] >= 1, goal_return
          assert goal_return['continuous_no_teleport'], goal_return
          assert verdict['six_independent_ducks_loaded'], verdict
          assert verdict['all_ducks_moved'], match['ducks']
          assert verdict['kick_executed'], match['metrics']
          assert verdict['ball_contacted'], match['metrics']
          assert match['metrics']['ball_distance_m'] > 0.05, match['metrics']
          assert verdict['ball_continuous'], match['metrics']

          required = [
              'microduck_3v3_mujoco_match.mp4',
              'goal_return_validation.mp4',
              'microduck_3v3_full_visual.xml',
              'match_trajectory.json',
              'match_results.json',
              'kick_calibration.csv',
              'kick_calibration.json',
              'goal_return_validation.json',
              'run_report.json',
          ]
          for name in required:
              p = root / name
              assert p.exists() and p.stat().st_size > 0, name

          print('V3_FULL_ACCEPTANCE_OK')
          print(json.dumps({
              'score': match['score'],
              'metrics': match['metrics'],
              'ducks': match['ducks'],
              'verdict_inputs': verdict,
              'goal_return_validation': goal_return,
              'kick_calibration': r['kick_calibration'],
          }, indent=2))
          PY

      - name: Package evidence
        if: always()
        run: |
          if [ -d artifacts ]; then
            cp upstream-commit.txt artifacts/ 2>/dev/null || true
            tar -czf microduck-3v3-six-body-mujoco-v3-full.tar.gz artifacts
          fi

      - name: Print concise result
        if: always()
        run: |
          test ! -f artifacts/run_report.json || python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/run_report.json').read_text())
          print(json.dumps({
              'source': r['source'],
              'model': r['model'],
              'kick_calibration': r['kick_calibration'],
              'goal_return_validation': r['goal_return_validation'],
              'score': r['match']['score'],
              'metrics': r['match']['metrics'],
              'ducks': r['match']['ducks'],
              'verdict_inputs': r['match']['verdict_inputs'],
          }, indent=2))
          PY

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microduck-3v3-six-body-mujoco-v3-full
          path: |
            artifacts
            microduck-3v3-six-body-mujoco-v3-full.tar.gz
          if-no-files-found: error
          retention-days: 7
